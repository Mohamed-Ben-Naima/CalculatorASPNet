name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore CalculatorASPNet.sln

      - name: Build
        run: dotnet build CalculatorASPNet.sln --no-restore

      - name: Test
        run: dotnet test CalculatorASPNet.sln --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: CalculatorASPNet.Tests/TestResults/results.trx
          if-no-files-found: ignore